<!DOCTYPE html>
<html>
<head>
    <title>Punch Counts</title>

    <link rel="stylesheet" href="style.css">
</head>
    <div class="login">
        <input id="email" type="email" placeholder="Email">
        <input id="password" type="password" placeholder="Password">
        <button id="loginBtn">Sign In</button>
        <button id="logoutBtn" hidden>Sign Out</button>
        <p id="authStatus">Not signed in</p>
    </div>

    <div class="container">
        <div class="person">
            <h1>Sho</h1>
            <div class="count">
                <button id="sho-">-</button>
                <h2 id="sho">0</h2>
                <button id="sho+">+</button>
            </div>
        </div>

        <div class="person">
            <h1>Ken</h1>
            <div class="count">
                <button id="ken-">-</button>
                <h2 id="ken">0</h2>
                <button id="ken+">+</button>
            </div>
        </div>
    </div>

    <script type="module" src="script.js"></script>

</body>
</html>
